services:
  - type: web
    name: mysearch-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SEARXNG_URL
        value: https://my-searxng-gf7s.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.8
